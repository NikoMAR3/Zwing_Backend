version: '3.8'

services:
  # PostgreSQL - Event Store
  postgres:
    image: postgres:16-alpine
    container_name: zwing-postgres
    environment:
      POSTGRES_USER: zwing
      POSTGRES_PASSWORD: zwing123
      POSTGRES_DB: zwing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zwing"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zwing-network

  # Redis - Event Bus
  redis:
    image: redis:7-alpine
    container_name: zwing-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zwing-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  zwing-network:
    driver: bridge