spring:
  application:
    name: zwing

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/zwing_db
    username: zwing
    password: zwing123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  # Redis
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 60000ms
    jedis:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

  # WebSocket
  websocket:
    enabled: true

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    eci.edu.zwing: DEBUG
    org.springframework.web.socket: DEBUG